version: "3.8"

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ai-log-analyzer-zookeeper-1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ai-log-analyzer-kafka-1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Localhost bahar ke liye hai, kafka:9092 internal docker network ke liye
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,LISTENER_DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,LISTENER_DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: LISTENER_DOCKER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      # Yahan ab hum internal port 29092 use karenge connection ke liye
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
  
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: ai-log-analyzer-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://ai-log-analyzer-elasticsearch-1:9200
    depends_on:
      - elasticsearch


  mongodb:
    image: mongo:7.0
    container_name: ai-log-analyzer-mongodb-1
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: log_analyzer
    volumes:
      - mongodb_data:/data/db

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ai-log-analyzer-elasticsearch-1
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  postgres:
    image: postgres:16
    container_name: ai-log-analyzer-postgres-1
    environment:
      POSTGRES_DB: log_analyzer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: ai-log-analyzer-redis-1
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  mongodb_data:
  es_data:
  postgres_data:
  redis_data: