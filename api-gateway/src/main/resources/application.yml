server:
  port: 8080

spring:
  application:
    name: api-gateway
  
  cloud:
    gateway:
      routes:
        - id: log-ingestion-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/logs/**
        
        - id: alert-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/alerts/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
